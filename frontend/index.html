<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#7a3b5c" />
    <script>
      // Apply the saved theme before first paint so pages don't flash the default colors.
      // Mirrors initialTheme() in src/theme.ts.
      try {
        var t = localStorage.getItem('wms.theme')
        if (['light', 'dark', 'blue', 'pink'].indexOf(t) < 0) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Wedding Gift Desk</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
