# Production: PostgreSQL + Django (gunicorn) + Caddy (HTTPS, built app). See docs/deploy.md.
#   cp .env.prod.example .env   # then fill it in
#   docker compose -f docker-compose.prod.yml up -d --build

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - media:/data/media
      - private_media:/data/private_media
      - static:/data/static

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
      args:
        VITE_OCR_LANGS: ${VITE_OCR_LANGS:-eng}
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - backend
    volumes:
      - static:/var/www/static:ro
      - media:/var/www/media:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  media:
  private_media: # client documents: only the backend mounts this
  static:
  caddy_data: # HTTPS certificates
  caddy_config:
